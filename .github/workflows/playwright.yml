name: Playwright Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: ./node_modules/.cache
    strategy:
      matrix:
        suite: [api, contract, e2e, accessibility]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit firefox
      - name: Verify Playwright browsers installed
        run: |
          echo "Listing node_modules/.cache"
          ls -la node_modules/.cache || true
          echo "Check common expected files"
          find node_modules/.cache -maxdepth 3 -type f -name 'headless_shell' -o -name 'pw_run.sh' || true
      - name: Start FakeStore mock for contract and api tests
        if: matrix.suite == 'contract' || matrix.suite == 'api'
        run: |
          npm run test:mock-server &
          for i in {1..30}; do
            if curl -sS -X POST http://127.0.0.1:3001/auth/login -H "Content-Type: application/json" -d '{}' >/dev/null 2>&1; then
              echo "mock server up"
              break
            fi
            echo "waiting for mock server..."
            sleep 1
          done
      - name: Run suite ${{ matrix.suite }}
        run: |
          case "${{ matrix.suite }}" in
            api) npm run test:api ;;
            contract) npm run test:contract ;;
            e2e) npm run test:e2e ;;
            accessibility) npm run test:accessibility ;;
          esac
        env:
          PLAYWRIGHT_BROWSERS_PATH: ./node_modules/.cache
          USE_LOCAL_MOCK: ${{ (matrix.suite == 'contract' || matrix.suite == 'api') && 'true' || 'false' }}
          FAKESTORE_BASE_URL: ${{ (matrix.suite == 'contract' || matrix.suite == 'api') && 'http://127.0.0.1:3001' || 'https://fakestoreapi.com' }}
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.suite }}
          path: playwright-report/
          retention-days: 30
